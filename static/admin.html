<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <span class="eyebrow">Система</span>
            <h1>Админ-панель</h1>
            <p class="subtitle">Пользователи и источники данных.</p>
        </header>

        <div class="management-grid">
            <div class="card">
                <h2 class="card-title-small">Пользователи</h2>
                <div id="userList" style="margin-bottom: 22px;"></div>

                <hr class="form-divider">
                <h3 class="form-subhead">Новый пользователь</h3>
                <form id="addUserForm" class="form-layout">
                    <input type="text" id="newUserLogin" class="styled-text-input" placeholder="Логин" required>
                    <input type="password" id="newUserPassword" class="styled-text-input" placeholder="Пароль" required>
                    <input type="text" id="newUserFullName" class="styled-text-input" placeholder="Отображаемое имя">
                    <select id="newUserRole" class="styled-text-input">
                        <option value="manager">Менеджер</option>
                        <option value="admin">Администратор</option>
                    </select>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Добавить</button>
                </form>
            </div>

            <div class="card">
                <h2 class="card-title-small">Google Таблицы</h2>

                <div class="alert-info">
                    <strong>Доступ.</strong> Выдайте права редактора сервисному аккаунту:
                    <code id="serviceEmail" class="service-email" title="Нажмите, чтобы скопировать">obed-store-service@obedstore-service.iam.gserviceaccount.com</code>
                </div>

                <div id="step1" class="form-layout">
                    <div class="form-group">
                        <label class="control-label">URL новой таблицы</label>
                        <input type="text" id="sheetUrl" class="styled-text-input" style="width: 100%; min-width: 0;" placeholder="https://docs.google.com/spreadsheets/d/…">
                    </div>
                    <button id="inspectBtn" class="btn btn-primary" style="align-self: flex-start;">Проверить доступ</button>
                </div>

                <div id="step2" class="form-layout" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--line-strong);">
                    <div class="form-group">
                        <label class="control-label">Лист для работы</label>
                        <select id="worksheetSelect" class="styled-text-input" style="width: 100%;"></select>
                    </div>
                    <button id="saveConfigBtn" class="btn btn-primary" style="align-self: flex-start;">Подключить и активировать</button>
                </div>

                <hr class="form-divider">
                <h3 class="form-subhead">Подключённые таблицы</h3>
                <div id="googleConfigList"></div>
            </div>
        </div>
    </div>

    <script src="/static/components.js"></script>
    <script src="/static/admin.js"></script>
</body>
</html>
