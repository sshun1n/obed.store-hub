<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="/static/img/logo.svg" alt="obed.store">
            <div>
                <div class="brand-word">obed.store<span>&nbsp;hub</span></div>
                <div class="brand-sub">рабочая среда</div>
            </div>
        </div>

        <header class="login-header">
            <h2>Вход в систему</h2>
            <p class="text-muted">Логин и пароль выдаёт администратор</p>
        </header>

        <div id="errorBox" class="error-msg"></div>

        <form id="loginForm" class="form-layout">
            <div class="form-group">
                <label for="username" class="control-label">Логин</label>
                <input type="text" id="username" class="styled-text-input" style="width: 100%; min-width: 0;" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" class="control-label">Пароль</label>
                <input type="password" id="password" class="styled-text-input" style="width: 100%; min-width: 0;" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;">Войти</button>
        </form>
    </div>

    <script src="/static/login.js"></script>
</body>
</html>
