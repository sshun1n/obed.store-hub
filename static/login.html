<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background-color: #F9FAFB;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo img {
            height: 64px;
            margin-bottom: 10px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .error-msg {
            color: var(--brand-red);
            font-size: 0.9rem;
            margin-bottom: 16px;
            text-align: center;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-logo">
            <img src="img/logo.svg" alt="Logo">
            <div class="brand-logo" style="justify-content: center; color: var(--brand-black);">
                obed.store <span>hub</span>
            </div>
        </div>
        
        <header class="login-header">
            <h2>Вход в систему</h2>
            <p class="text-muted">Введите данные для доступа</p>
        </header>

        <div id="errorBox" class="error-msg"></div>

        <form id="loginForm" class="form-layout">
            <div class="form-group">
                <label for="username" class="control-label">Логин</label>
                <input type="text" id="username" class="styled-text-input" style="width: 100%;" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" class="control-label">Пароль</label>
                <input type="password" id="password" class="styled-text-input" style="width: 100%;" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Войти</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
