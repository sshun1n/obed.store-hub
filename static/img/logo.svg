<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Основной фон (Фирменный красный) -->
    <rect width="512" height="512" rx="128" fill="#EE4B4B"/>
    
    <!-- Основание поварского колпака -->
    <rect x="160" y="350" width="192" height="70" rx="20" fill="white"/>
    
    <!-- Узлы Хаба (Верхушка колпака) -->
    <!-- Левый узел -->
    <circle cx="180" cy="260" r="75" fill="white"/>
    <!-- Правый узел -->
    <circle cx="332" cy="260" r="75" fill="white"/>
    <!-- Центральный доминирующий узел -->
    <circle cx="256" cy="190" r="95" fill="white"/>
    
    <!-- Центральная точка связи (Акцент Хаба) -->
    <circle cx="256" cy="190" r="30" fill="#EE4B4B"/>
</svg>
