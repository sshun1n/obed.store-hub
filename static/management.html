<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление | OBED.STORE</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Шапка будет вставлена сюда автоматически -->

    <div class="container">
        <header class="page-header">
            <h1>Управление</h1>
            <p class="subtitle">Настройка категорий, продуктов и фильтров</p>
        </header>

        <div class="management-grid">
            <!-- Левая колонка: Дерево категорий -->
            <div class="card">
                <h2 class="card-title-small">Дерево категорий</h2>
                <div id="categoryTree" class="category-tree">
                    <!-- Дерево будет рендериться сюда с помощью JS -->
                    <p class="text-muted">Загрузка категорий...</p>
                </div>
            </div>

            <!-- Правая колонка: Формы -->
            <div class="card">
                <h2 class="card-title-small">Добавить категорию</h2>
                <form id="addCategoryForm" class="form-layout">
                    <div class="form-group">
                        <label for="categoryName" class="control-label">Название новой категории</label>
                        <input type="text" id="categoryName" class="styled-text-input" placeholder="например, 'Горячий цех' или 'Десерты'" required>
                    </div>
                    <!-- В будущем здесь будет выбор родительской категории -->
                    <div class="form-group">
                        <label for="parentCategory" class="control-label">Родительская категория</label>
                        <select id="parentCategory" class="styled-text-input">
                            <option value="">-- Корневая категория --</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </form>
            </div>
        </div>

        <!-- Секция: Справочник продукции -->
        <section id="product-directory" class="management-section">
            <header class="page-header">
                <h2>Справочник продукции</h2>
                <p class="subtitle">Привяжите товары из Google Таблиц к категориям и цехам</p>
            </header>

            <div class="card">
                <div class="controls-panel" style="box-shadow: none; padding: 0; margin-bottom: 20px;">
                    <div class="input-group">
                        <input type="search" id="productSearchInput" class="styled-text-input" placeholder="Поиск продукта...">
                        <select id="productCategoryFilter" class="styled-text-input">
                            <option value="">-- Все категории --</option>
                            <option value="none">⚠️ Без категории</option>
                        </select>
                    </div>
                    <div id="productStatusMsg" class="status-text"></div>
                </div>

                <div id="productList" class="product-list-container">
                    <p class="text-muted" style="padding: 20px; text-align: center;">Загрузка справочника продукции...</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Футер будет вставлен сюда автоматически -->
    
    <!-- Контекстное меню выбора категорий (скрыто по умолчанию) -->
    <div id="categoryContextMenu" class="context-menu" hidden></div>

    <script src="/static/components.js"></script>
    <script src="/static/management.js"></script>
</body>
</html>
