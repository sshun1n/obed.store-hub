<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.7.1">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <span class="eyebrow">Сервис 03</span>
            <h1>Управление</h1>
            <p class="subtitle">Категории, фильтры для цехов и справочник продукции.</p>
        </header>

        <div class="management-grid">
            <div class="card">
                <h2 class="card-title-small">Дерево категорий</h2>
                <div id="categoryTree" class="category-tree">
                    <p class="text-muted">Загрузка категорий…</p>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title-small">Добавить категорию</h2>
                <form id="addCategoryForm" class="form-layout">
                    <div class="form-group">
                        <label for="categoryName" class="control-label">Название</label>
                        <input type="text" id="categoryName" class="styled-text-input" placeholder="Например, «Горячий цех» или «Десерты»" required>
                    </div>
                    <div class="form-group">
                        <label for="parentCategory" class="control-label">Родительская категория</label>
                        <select id="parentCategory" class="styled-text-input">
                            <option value="">— корневая —</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Создать</button>
                </form>
            </div>
        </div>

        <section id="product-directory" class="management-section">
            <header class="page-header">
                <h2 style="font-size: 1.4rem;">Справочник продукции</h2>
                <p class="subtitle">Привяжите позиции из Google Таблиц к категориям и цехам.</p>
            </header>

            <div class="card">
                <div class="input-group" style="margin-bottom: 16px;">
                    <input type="search" id="productSearchInput" class="styled-text-input" placeholder="Поиск продукта…">
                    <select id="productCategoryFilter" class="styled-text-input">
                        <option value="">— все категории —</option>
                        <option value="none">Без категории</option>
                    </select>
                    <div id="productStatusMsg" class="status-text"></div>
                </div>

                <div id="productList" class="product-list-container">
                    <p class="text-muted" style="padding: 20px; text-align: center;">Загрузка справочника…</p>
                </div>
            </div>
        </section>
    </div>

    <div id="categoryContextMenu" class="context-menu" hidden></div>

    <script src="/static/components.js?v=1.7.1"></script>
    <script src="/static/management.js"></script>
</body>
</html>
