<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продукция | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.15.3">
    <link rel="expect" href="#hubEnd" blocking="render">
</head>
<body>
    <script src="/static/components.js?v=1.15.0"></script>
    <div class="container">
        <header class="page-header page-head-row">
            <div>
                <span class="eyebrow">Система</span>
                <h1>Продукция</h1>
                <p class="subtitle">Товары из Google Таблиц и добавленные вручную. Нажмите на товар, чтобы открыть карточку.</p>
            </div>
            <div id="syncBar" class="sync-bar"></div>
        </header>

        <section id="product-directory">
            <div class="card">
                <div class="input-group product-filters">
                    <input type="search" id="productSearchInput" class="styled-text-input" placeholder="Название или штрих-код…">
                    <select id="productCategoryFilter" class="styled-text-input">
                        <option value="">Все категории</option>
                        <option value="none">Без категории</option>
                    </select>
                    <select id="productStateFilter" class="styled-text-input" aria-label="Состояние карточки">
                        <option value="">Все товары</option>
                        <option value="missing">Нужно заполнить</option>
                        <option value="hidden">Скрытые</option>
                    </select>
                    <button type="button" id="addProductBtn" class="btn btn-primary product-add" hidden>Добавить товар</button>
                </div>

                <div id="productList" class="product-list-container"></div>
            </div>
        </section>

        <section class="management-section">
            <header class="page-header">
                <h2 class="section-title">Категории</h2>
                <p class="subtitle">Цеха и фильтры. Товары привязываются к ним в карточке.</p>
            </header>

            <div class="management-grid">
                <div class="card">
                    <h3 class="card-title-small">Дерево категорий</h3>
                    <div id="categoryTree" class="category-tree">
                        <p class="text-muted">Загрузка категорий…</p>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title-small">Добавить категорию</h3>
                    <form id="addCategoryForm" class="form-layout">
                        <div class="form-group">
                            <label for="categoryName" class="control-label">Название</label>
                            <input type="text" id="categoryName" class="styled-text-input" placeholder="Например, «Горячий цех» или «Десерты»" required>
                        </div>
                        <div class="form-group">
                            <label for="parentCategory" class="control-label">Родительская категория</label>
                            <select id="parentCategory" class="styled-text-input">
                                <option value="">Корневая</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Создать</button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content product-card" id="productCard" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    <div id="categoryContextMenu" class="context-menu" hidden></div>

    <script src="/static/hub-ui.js?v=1.10.0"></script>
    <script src="/static/sync.js?v=1.9.4"></script>
    <script src="/static/management.js?v=1.11.0"></script>
    <div id="hubEnd" hidden></div>
</body>
</html>
