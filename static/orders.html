<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы по точкам | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <span class="eyebrow">Сервис 02</span>
            <h1>Заказы по точкам</h1>
            <p class="subtitle">Состав отгрузки по каждому адресу доставки.</p>
        </header>

        <section class="controls-panel">
            <div class="date-control-wrapper">
                <label for="orderDate" class="control-label">Дата отгрузки</label>
                <div class="date-input-container">
                    <input type="date" id="orderDate" class="styled-date-input">
                </div>
                <div class="quick-dates">
                    <button id="todayBtn" class="chip">Сегодня</button>
                    <button id="tomorrowBtn" class="chip">Завтра</button>
                </div>
            </div>

            <div class="input-group">
                <div id="statusMsg" class="status-text"></div>
                <button id="refreshBtn" class="btn btn-primary">Обновить</button>
            </div>
        </section>

        <div id="loading" style="text-align: center; padding: 40px; display: none; color: var(--muted); font-family: var(--mono); font-size: 0.8rem;">Загрузка…</div>
        <div id="ordersContainer" class="orders-grid"></div>
    </div>

    <script src="/static/components.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
