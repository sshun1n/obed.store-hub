<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы по точкам | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.15.2">
    <link rel="expect" href="#hubEnd" blocking="render">
</head>
<body>
    <script src="/static/components.js?v=1.15.0"></script>
    <div class="container">
        <header class="page-header page-head-row">
            <div>
                <span class="eyebrow">Сервис 02</span>
                <h1>Заказы по точкам</h1>
                <p class="subtitle">Состав отгрузки по каждому адресу доставки.</p>
            </div>
            <div id="syncBar" class="sync-bar"></div>
        </header>

        <section class="controls-panel">
            <div class="date-control-wrapper">
                <label for="orderDate" class="control-label">Дата отгрузки</label>
                <div class="date-input-container">
                    <input type="date" id="orderDate" class="styled-date-input">
                </div>
                <div class="quick-dates">
                    <button id="todayBtn" class="chip">Сегодня</button>
                    <button id="tomorrowBtn" class="chip">Завтра</button>
                </div>
            </div>
        </section>

        <div id="ordersContainer" class="orders-grid"></div>
    </div>

    <script src="/static/sync.js?v=1.9.4"></script>
    <script src="/static/app.js?v=2.1.0"></script>
    <div id="hubEnd" hidden></div>
</body>
</html>
