<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт времени | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.8.0">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <span class="eyebrow">Сервис 04</span>
            <h1>Учёт рабочего времени</h1>
            <p class="subtitle">Табель сотрудников, нормы смен и автоматический расчёт зарплаты со штрафами.</p>
        </header>

        <div id="accessDenied" class="alert-danger" style="display:none; cursor:default;">
            Раздел доступен только администраторам.
        </div>

        <div id="tsContent" style="display:none;">
            <div class="controls-panel">
                <div class="date-control-wrapper">
                    <span class="control-label">Период</span>
                    <input type="date" id="periodStart" class="styled-date-input">
                    <span class="text-muted">—</span>
                    <input type="date" id="periodEnd" class="styled-date-input">
                    <div class="quick-dates">
                        <button class="chip" id="chipThisMonth">Этот месяц</button>
                        <button class="chip" id="chipPrevMonth">Прошлый месяц</button>
                        <button class="chip" id="chipLastImport" style="display:none;">Период табеля</button>
                    </div>
                </div>
                <div class="input-group">
                    <label class="filter-item" style="padding:0;">
                        <input type="checkbox" id="showArchived"> архивные
                    </label>
                    <input type="file" id="fileInput" accept=".xls,.xlsx" hidden>
                    <button class="btn btn-primary" id="uploadBtn">Загрузить табель</button>
                </div>
            </div>

            <div id="uploadStatus" class="ts-upload-status" style="display:none;"></div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><span class="stat-label">Сотрудников</span><span class="stat-value" id="statEmployees">—</span></div>
                <div class="stat-card"><span class="stat-label">Отработано</span><span class="stat-value" id="statHours">—</span></div>
                <div class="stat-card"><span class="stat-label">Начислено</span><span class="stat-value" id="statBase">—</span></div>
                <div class="stat-card"><span class="stat-label">Штрафы</span><span class="stat-value stat-red" id="statPenalty">—</span></div>
                <div class="stat-card"><span class="stat-label">К выплате</span><span class="stat-value" id="statTotal">—</span></div>
            </div>

            <div class="table-wrapper ts-table">
                <table>
                    <thead>
                        <tr>
                            <th>Сотрудник</th>
                            <th>Смены</th>
                            <th>Часы</th>
                            <th>Недоработка</th>
                            <th>Нарушения</th>
                            <th>Ставка</th>
                            <th>Начислено</th>
                            <th>Штраф</th>
                            <th>Итого</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="reportBody">
                        <tr><td colspan="10" class="empty-state">Загрузка…</td></tr>
                    </tbody>
                </table>
            </div>

            <p class="text-muted" id="lastImportInfo" style="font-size:0.78rem; margin-top:12px;"></p>
        </div>
    </div>

    <script src="/static/components.js?v=1.8.0"></script>
    <script src="/static/hub-ui.js?v=1.8.0"></script>
    <script src="/static/timesheet.js?v=1.8.0"></script>
</body>
</html>
