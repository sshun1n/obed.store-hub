<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СБИС Самоката | OBED.STORE Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.27.0">
    <link rel="expect" href="#hubEnd" blocking="render">
    <style>
        .samokat-files { margin: 6px 0 0; padding-left: 18px; max-height: 220px; overflow-y: auto; }
        .samokat-files summary { cursor: pointer; }
        .saby-step .saby-soon { font-size: 0.74rem; color: var(--muted); }
    </style>
</head>
<body>
    <script src="/static/components.js?v=1.22.0"></script>
    <div class="container">
        <header class="page-header page-head-row">
            <div>
                <span class="eyebrow">Самокат</span>
                <h1>СБИС Самоката</h1>
                <p class="subtitle">Документы по заказам ООО «Умный ритейл» за день поставки и следующий шаг по ним.</p>
            </div>
            <button type="button" class="icon-btn saby-gear" id="settingsBtn" aria-label="Настройки СБИС Самоката" title="Настройки СБИС Самоката" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </button>
        </header>

        <div class="controls-panel lavka-controls">
            <div class="period-picker" id="periodPicker">
                <button type="button" class="icon-btn" id="prevPeriod" aria-label="Предыдущая поставка">‹</button>
                <button type="button" class="period-btn" id="periodBtn" aria-haspopup="dialog" aria-expanded="false">
                    <span class="period-kind" id="periodKind">День</span>
                    <span class="period-label" id="periodLabel">—</span>
                    <span class="period-caret" aria-hidden="true">▾</span>
                </button>
                <button type="button" class="icon-btn" id="nextPeriod" aria-label="Следующая поставка">›</button>
                <div class="period-pop" id="periodPop" role="dialog" aria-label="Выбор дня поставки" hidden></div>
            </div>
            <div class="lavka-actions saby-actions">
                <span class="lavka-mail-state" id="sabyState"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="refreshBtn">Обновить из СБИС</button>
            </div>
        </div>
        <input type="file" id="registryInput" accept=".xls" hidden>

        <div id="notices"></div>
        <div id="content"><div class="empty-state">Загрузка…</div></div>
    </div>

    <div class="modal" id="signModal" data-keep-open>
        <div class="modal-content saby-sign" role="dialog" aria-modal="true" aria-labelledby="signTitle">
            <span class="eyebrow">Подпись Рутокеном</span>
            <h2 class="card-title-small" id="signTitle">Подписать</h2>
            <p class="field-hint" id="signWhat"></p>
            <label class="form-group" id="signCertBox" hidden><span>Сертификат</span><select class="styled-text-input" id="signCert"></select></label>
            <p class="saby-sign-status" id="signStatus"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="signCancel">Отмена</button>
                <button type="button" class="btn btn-primary" id="signGo" disabled>Подписать и отправить</button>
            </div>
        </div>
    </div>

    <script src="/static/hub-ui.js?v=1.10.0"></script>
    <script src="/static/period-picker.js?v=1.19.0"></script>
    <script src="/static/saby-sign.js?v=1.25.0"></script>
    <script src="/static/saby-settings.js?v=1.2.0"></script>
    <script src="/static/samokat-saby.js?v=1.10.0"></script>
    <div id="hubEnd" hidden></div>
</body>
</html>
